<script type="text/javascript">

  let arrow_side = 1;  // downside
  $(document).ready(function(){

    //intial value
    $("#input_dis").hide();
    $("#arrow_t").addClass("fa-angle-down");
    $("#arrow_t").removeClass("fa-angle-up");

    $("#arrow_t").click(function(){
      $("#input_dis").toggle();
      
      if(arrow_side==0)
      {
        $("#arrow_t").addClass("fa-angle-up");
        $("#arrow_t").removeClass("fa-angle-down");
        arrow_side=1;
      }
      else
      {
        $("#arrow_t").addClass("fa-angle-down");
        $("#arrow_t").removeClass("fa-angle-up");
        arrow_side=0;
      }
    });
  });

</script>
