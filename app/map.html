<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR 3D Direction</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: black;
    }
    #distance {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="distance">Calculating distance...</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>

  <script>
    // ---------- URL PARAMS ----------
    const urlParams = new URLSearchParams(window.location.search);
    const locParam = urlParams.get("location");

    // Default destination → Marvel Stadium Gate 3
    const destination = locParam
      ? JSON.parse(locParam)
      : {"lat": -37.926842340381, "long": 145.11908574083};

    let userLat = null;
    let userLng = null;
    let userHeading = 0;

    const distanceLabel = document.getElementById("distance");

    // ---------- THREE.JS SETUP ----------
    const scene = new THREE.Scene();

    // Camera → positioned like AR
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Transparent background for live camera
    renderer.setClearColor(0x000000, 0);

    // 3D Arrow
    const arrowGeometry = new THREE.ConeGeometry(1, 3, 32);
    const arrowMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const arrow = new THREE.Mesh(arrowGeometry, arrowMaterial);
    arrow.rotation.x = Math.PI; // Point arrow forward
    scene.add(arrow);

    // Lighting for 3D arrow
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 5, 10).normalize();
    scene.add(light);

    // ---------- DISTANCE + BEARING ----------
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = deg => (deg * Math.PI) / 180;
      const toDeg = rad => (rad * 180) / Math.PI;

      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x =
        Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
        Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // meters
      const φ1 = (lat1 * Math.PI) / 180;
      const φ2 = (lat2 * Math.PI) / 180;
      const Δφ = ((lat2 - lat1) * Math.PI) / 180;
      const Δλ = ((lon2 - lon1) * Math.PI) / 180;

      const a =
        Math.sin(Δφ / 2) ** 2 +
        Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return R * c;
    }

    // ---------- UPDATE ARROW ----------
    function updateArrow() {
      if (userLat == null || userLng == null) return;

      const bearing = calculateBearing(userLat, userLng, destination.lat, destination.long);
      const angle = THREE.MathUtils.degToRad(bearing - userHeading);

      // Rotate the arrow around Y-axis
      arrow.rotation.y = angle;

      const dist = calculateDistance(userLat, userLng, destination.lat, destination.long);
      distanceLabel.innerText = `${dist < 1000 ? dist.toFixed(0) + " m" : (dist / 1000).toFixed(2) + " km"} away`;
    }

    // ---------- GPS TRACKING ----------
    if (!locParam) {
      navigator.geolocation.watchPosition(
        pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          updateArrow();
        },
        err => console.error("GPS error:", err),
        { enableHighAccuracy: true }
      );
    } else {
      const parsed = JSON.parse(locParam);
      userLat = parsed.lat;
      userLng = parsed.long;
      updateArrow();
    }

    // ---------- COMPASS HEADING ----------
    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientationabsolute", e => {
        if (e.alpha !== null) {
          userHeading = e.alpha;
          updateArrow();
        }
      });

      window.addEventListener("deviceorientation", e => {
        if (e.alpha !== null) {
          userHeading = e.alpha;
          updateArrow();
        }
      });
    }

    // ---------- ANIMATE ----------
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
