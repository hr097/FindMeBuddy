<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Marvel Stadium Route</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body, html { margin:0; height:100%; }
    #map { width:100%; height:100%; }
  </style>
</head>
<body id="map" >
<div></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // --- 1. Get URL parameters for starting point & gate ---
  const params = new URLSearchParams(window.location.search);
  const startX = parseFloat(params.get('startX')) || 1800; // default x
  const startY = parseFloat(params.get('startY')) || 200;  // default y
  const gate = params.get('gate') || '3';

  // --- 2. Image overlay setup ---
  const imageUrl = 'marvel-stadium.png'; // uploaded image
  const imageWidth = 4000;  // adjust according to your image
  const imageHeight = 2500; // adjust according to your image
  const bounds = [[0,0],[imageHeight,imageWidth]]; // top-left, bottom-right

  const map = L.map('map', { crs:L.CRS.Simple, minZoom:-2 });
  L.imageOverlay(imageUrl, bounds).addTo(map);
  map.fitBounds(bounds);

  // --- 3. Gate coordinates (pixel positions on image) ---
  const gates = {
    "1": [1600, 300],
    "2": [1500, 600],
    "3": [300, 1800],
    "4": [400, 1500],
    "5": [500, 1300],
    "6": [600, 1100],
    "7": [800, 900],
    "8": [1000, 700],
    "9": [1200, 500]
  };

  // --- 4. Add markers ---
  const startMarker = L.marker([startY, startX]).addTo(map).bindPopup("You are here").openPopup();
  const gatePos = gates[gate] || gates['3'];
  const gateMarker = L.marker([gatePos[0], gatePos[1]]).addTo(map).bindPopup(`Gate ${gate}`);

  // --- 5. Draw route ---
  const route = L.polyline([
    [startY, startX],
    [gatePos[0], gatePos[1]]
  ], { color: 'green', weight: 4 }).addTo(map);

</script>
</body>
</html>
